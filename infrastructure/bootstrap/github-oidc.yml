AWSTemplateFormatVersion: '2010-09-09'
Description: One-time GitHub OIDC deployment role; use an existing CloudFormation execution role.
Parameters:
  GitHubRepository:
    Type: String
    Description: Exact owner/repository, including case.
    AllowedPattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
  EnvironmentName:
    Type: String
    AllowedValues: [dev, test, staging, production]
  ExistingOidcProviderArn:
    Type: String
    Default: ''
    Description: Reuse the account GitHub OIDC provider if one already exists.
  CloudFormationExecutionRoleArn:
    Type: String
    Description: Existing role trusted by cloudformation.amazonaws.com with permissions to manage these templates.
Conditions:
  CreateProvider: !Equals [!Ref ExistingOidcProviderArn, '']
Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub property-intelligence-${EnvironmentName}-github
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateProvider, !Ref GitHubProvider, !Ref ExistingOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:${EnvironmentName}
      Policies:
        - PolicyName: DeployPlatform
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManagePlatformStacks
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/property-intelligence-${EnvironmentName}-*/*
              - Sid: PassCloudFormationRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Ref CloudFormationExecutionRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: RegistryLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PushReleaseImage
                Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage, ecr:DescribeImages]
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/property-intelligence-${EnvironmentName}-api
              - Sid: RunMigrations
                Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/property-intelligence-${EnvironmentName}-migration:*
                Condition:
                  ArnEquals:
                    ecs:cluster: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/property-intelligence-${EnvironmentName}
              - Sid: ObserveMigrations
                Effect: Allow
                Action: [ecs:DescribeTasks, ecs:StopTask]
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/property-intelligence-${EnvironmentName}/*
              - Sid: PassMigrationRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/property-intelligence-${EnvironmentName}-migration-execution
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/property-intelligence-${EnvironmentName}-task
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: PublishFrontend
                Effect: Allow
                Action: [s3:ListBucket, s3:GetObject, s3:PutObject]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::pip-${EnvironmentName}-web-${AWS::AccountId}-${AWS::Region}
                  - !Sub arn:${AWS::Partition}:s3:::pip-${EnvironmentName}-web-${AWS::AccountId}-${AWS::Region}/*
              - Sid: RefreshFrontendCache
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
Outputs:
  DeploymentRoleArn:
    Value: !GetAtt DeploymentRole.Arn
  OidcProviderArn:
    Value: !If [CreateProvider, !Ref GitHubProvider, !Ref ExistingOidcProviderArn]
