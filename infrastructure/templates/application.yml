AWSTemplateFormatVersion: '2010-09-09'
Description: HTTPS API ingress and ECS service; updated only after migrations succeed.
Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, test, staging, production]
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  ApplicationSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  LoadBalancerSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  ClusterArn:
    Type: String
  ApiTaskDefinitionArn:
    Type: String
  CertificateArn:
    Type: String
    Description: Issued ACM certificate in this region covering ApiDomainName.
  ApiDomainName:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]+'
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
Resources:
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref LoadBalancerSecurityGroupId]
      Subnets: !Ref PublicSubnetIds
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
  ApiDns:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      Cluster: !Ref ClusterArn
      ServiceName: !Sub property-intelligence-${EnvironmentName}-api
      TaskDefinition: !Ref ApiTaskDefinitionArn
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref ApplicationSecurityGroupId]
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
Outputs:
  ApiUrl:
    Value: !Sub https://${ApiDomainName}
  ServiceName:
    Value: !GetAtt Service.Name
