AWSTemplateFormatVersion: '2010-09-09'
Description: Persistent PostgreSQL, document storage, and work queue resources.
Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, test, staging, production]
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  ApplicationSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
  DatabaseEngineVersion:
    Type: String
    Default: '16.15'
    Description: Verify availability and PostGIS support in the target AWS region before deploying.
  DatabaseMultiAz:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
Conditions:
  MultiAz: !Equals [!Ref DatabaseMultiAz, 'true']
  Production: !Equals [!Ref EnvironmentName, production]
Resources:
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL access from application and migration tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ApplicationSecurityGroupId
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private database subnets
      SubnetIds: !Ref PrivateSubnetIds
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub property-intelligence-${EnvironmentName}
      Engine: postgres
      EngineVersion: !Ref DatabaseEngineVersion
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: '20'
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      DBName: property_intelligence
      MasterUsername: platform_admin
      ManageMasterUserPassword: true
      PubliclyAccessible: false
      MultiAZ: !If [MultiAz, true, false]
      DeletionProtection: !If [Production, true, false]
      BackupRetentionPeriod: 7
      AutoMinorVersionUpgrade: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt DocumentsBucket.Arn, !Sub '${DocumentsBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  WorkQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      VisibilityTimeout: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5
Outputs:
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseAdminSecretArn:
    Description: Bootstrap database users through a private administrative connection; never use this as the runtime identity.
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
  WorkQueueUrl:
    Value: !Ref WorkQueue
